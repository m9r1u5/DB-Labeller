<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>DB Board Labeller</title>
  <meta name="description" content="Photograph a distribution board, tag each breaker and print labels and a circuit schedule for the COC. Works offline.">
  <meta name="theme-color" content="#15191f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DB Labeller">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=1.0.3">
  <script>
    // Apply saved theme before first paint
    try { var t = localStorage.getItem('dbl-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="app">
    <button class="icon-btn hidden" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">DB Board Labeller</h1>
    <div id="hdrActions"></div>
  </header>
  <main id="main"></main>
  <div id="overlay"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script src="pdf.js?v=1.0.3"></script>
  <script src="app.js?v=1.0.3"></script>
</body>
</html>

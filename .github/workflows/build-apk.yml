name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read app version
        id: ver
        run: |
          V=$(grep -oP "const VERSION = '\K[^']+" app.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"

      - name: Prepare Capacitor project
        run: |
          mkdir -p build/www
          cp apk/package.json apk/capacitor.config.json build/
          cp index.html style.css app.js pdf.js manifest.json version.json *.png build/www/
          cd build
          npm install --no-audit --no-fund
          npx cap add android

      - name: App icon, version and permissions
        run: |
          cd build/android
          cp -r ../../apk/res/* app/src/main/res/
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.version }}\"/" app/build.gradle
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' app/src/main/AndroidManifest.xml
          grep -E "versionCode|versionName" app/build.gradle
          grep uses-permission app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=build/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks apk/signing.keystore --ks-pass pass:dblabeller --key-pass pass:dblabeller \
            --ks-key-alias dblabeller --out DB-Labeller.apk aligned.apk
          "$BT/apksigner" verify DB-Labeller.apk
          ls -la DB-Labeller.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DB-Labeller-v${{ steps.ver.outputs.version }}
          path: DB-Labeller.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DB Board Labeller v${{ steps.ver.outputs.version }}
          body: |
            Android APK for DB Board Labeller v${{ steps.ver.outputs.version }} (build ${{ github.run_number }}).
            Download **DB-Labeller.apk** below, open it, and allow "Install unknown apps" if Android asks.
            Web / iPhone version: https://m9r1u5.github.io/DB-Labeller/
          files: DB-Labeller.apk
          make_latest: true

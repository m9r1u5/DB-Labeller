name: Publish web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub Pages to rebuild from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '.status' || {
            echo "::error::Pages rebuild request failed – check Settings → Pages is set to Deploy from branch main / (root)"; exit 1; }
